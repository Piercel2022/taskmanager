name: Build and Deploy TaskManager

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  JAVAFX_VERSION: '21.0.1'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run tests
      run: mvn clean test

  build-cross-platform:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            executable-suffix: ''
            archive-format: tar.gz
          - os: windows-latest
            platform: windows
            executable-suffix: .exe
            archive-format: zip
          - os: macos-latest
            platform: macos
            executable-suffix: ''
            archive-format: tar.gz
    
    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.platform }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Build application
      run: mvn clean compile javafx:jlink
      
    - name: Create distribution directory
      run: mkdir -p dist
      
    - name: Copy built application (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cp -r target/image/* dist/
        chmod +x dist/bin/taskmanager
        
    - name: Copy built application (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        xcopy target\image\* dist\ /E /I
        
    - name: Create archive (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd dist
        tar -czf ../taskmanager-${{ matrix.platform }}.tar.gz *
        
    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd dist
        7z a ../taskmanager-${{ matrix.platform }}.zip *
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: taskmanager-${{ matrix.platform }}
        path: |
          taskmanager-${{ matrix.platform }}.*
        retention-days: 30

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    name: Build Docker Image
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager
          ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-cross-platform, build-docker]
    runs-on: ubuntu-latest
    name: Create Release
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: [test, build-cross-platform]
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    
    permissions:
      contents: read
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts
        
    - name: Create download page
      run: |
        mkdir -p public
        cat > public/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>TaskManager Downloads</title>
            <meta charset="utf-8">
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; }
                .download-section { margin: 20px 0; }
                .download-button { 
                    display: inline-block; 
                    padding: 10px 20px; 
                    background: #007cba; 
                    color: white; 
                    text-decoration: none; 
                    border-radius: 5px; 
                    margin: 5px;
                }
                .download-button:hover { background: #005a87; }
            </style>
        </head>
        <body>
            <h1>TaskManager Application Downloads</h1>
            <p>Choose your platform to download the latest version:</p>
            
            <div class="download-section">
                <h2>Desktop Applications</h2>
                <a href="taskmanager-linux.tar.gz" class="download-button">Download for Linux</a>
                <a href="taskmanager-windows.zip" class="download-button">Download for Windows</a>
                <a href="taskmanager-macos.tar.gz" class="download-button">Download for macOS</a>
            </div>
            
            <div class="download-section">
                <h2>Docker</h2>
                <p>Run with Docker:</p>
                <code>docker run -p 8080:8080 ghcr.io/${{ github.repository }}:main</code>
            </div>
            
            <div class="download-section">
                <h2>Installation Instructions</h2>
                <h3>Desktop Application</h3>
                <ol>
                    <li>Download the appropriate file for your operating system</li>
                    <li>Extract the archive</li>
                    <li>Run the executable in the bin/ directory</li>
                    <li>Requires Java 17+ to be installed</li>
                </ol>
            </div>
        </body>
        </html>
        EOF
        
    - name: Copy download files
      run: |
        find artifacts -name "*.tar.gz" -o -name "*.zip" | xargs -I {} cp {} public/
        
    - name: Setup Pages
      uses: actions/configure-pages@v3
      
    - name: Upload to Pages
      uses: actions/upload-pages-artifact@v2
      with:
        path: public
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2